name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-worker-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Go formatting
        run: make fmt-check
      - name: Set up cached Go linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Lint native and Wasm Go code
        run: make lint
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: go test -race ./...
      - run: npm test
      - name: Build and check complete Worker upload size (64 MiB)
        run: npm run check:worker-size
      - name: Verify the actual Wasm bridge
        run: node worker/wasm_test.mjs build/monitor.wasm "$(go env GOROOT)/lib/wasm/wasm_exec.js"
      - name: Keep size report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-size
          path: build/worker-size.json
          if-no-files-found: ignore
